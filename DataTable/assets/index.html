<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Colours follow the visualization (Symcon sets --content-color and
   --accent-color), not the operating system. detectTheme() decides light or
   dark from the content colour and finds an opaque surface colour for
   sticky headers and dialogs. */
#app{
 --accent:var(--accent-color,#00c3a5);--accent-fg:#fff;--fg:var(--content-color,#23262b);--muted:#6f757d;
 --line:rgba(128,128,128,.28);--hover:rgba(128,128,128,.09);--sel:rgba(0,195,165,.16);--input:rgba(128,128,128,.08);
 --danger:#e5484d;--surface:var(--card-color,#fff);--backdrop:rgba(0,0,0,.35);--warn-bg:rgba(255,170,0,.15);--warn:#8a5a00;
 --radius:8px;--corner:0px;color-scheme:light
}
#app[data-theme=dark]{--fg:var(--content-color,#e6e7e9);--muted:#a3a9b0;--surface:var(--card-color,#262a2f);--backdrop:rgba(0,0,0,.6);--warn:#ffc266;--warn-bg:rgba(255,170,0,.18);color-scheme:dark}
@supports (color:color-mix(in srgb,red,blue)){#app{--muted:color-mix(in srgb,var(--fg) 62%,transparent);--sel:color-mix(in srgb,var(--accent) 17%,transparent)}}
@font-face{font-family:Poppins;src:url('/assets/google_fonts/Poppins-Light.ttf') format('truetype');font-weight:300;font-style:normal}
*{box-sizing:border-box}
/* As in TreeView: no styles on html/body. Symcon reserves the space for a tile
   title there; #app stays in the normal flow below it and layout() sizes it
   to the space left down to the bottom of the viewport. */
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
.hidden{display:none!important}

/* ---- Layout ---------------------------------------------------------- */
#app{position:relative;overflow:hidden;background:transparent;color:var(--fg);font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:300;font-size:15px;line-height:1.45;letter-spacing:.2px;
 display:grid;grid-template-columns:minmax(300px,42%) 1fr;grid-template-rows:100%}
#listPane,#detailPane{display:flex;flex-direction:column;min-width:0;min-height:0}
#detailPane{border-left:1px solid var(--line);container-type:inline-size}
#summary{display:none}
#cfgError{display:none}
#app[data-error] #listPane,#app[data-error] #detailPane,#app[data-error] #summary{display:none!important}
#app[data-error]{grid-template-columns:100%}
#app[data-error] #cfgError{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:16px 20px;text-align:center}
.cfg-title{font-weight:600}
.cfg-text{color:var(--muted);max-width:520px}
#app[data-size=m]{grid-template-columns:100%}
#app[data-size=m][data-view=list] #detailPane,#app[data-size=m][data-view=detail] #listPane{display:none}
#app[data-size=m] #detailPane{border-left:0}
#app:not([data-size=m]) #btnBack{display:none}
#app[data-size=s] #listPane,#app[data-size=s] #detailPane{display:none}
#app[data-size=s]{grid-template-columns:100%}
#app[data-size=s] #summary{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4px 14px;gap:2px}
.sum-count{font-size:38px;font-weight:600;line-height:1.1}
.sum-label{color:var(--muted)}
.sum-groups{margin-top:6px;color:var(--muted);font-size:13px}

/* ---- Toolbars -------------------------------------------------------- */
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:54px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .grow{flex:1 1 120px;min-width:0}
/* Symcon draws its maximize button over the top right corner of a tile
   without title. layout() sets --corner then; the topmost bar on the right
   keeps that space free. */
#detailPane>.bar,#app[data-size=m] #listPane>.bar{padding-right:calc(10px + var(--corner))}
#app[data-size=s] #summary{padding-right:calc(14px + var(--corner))}
.spacer{flex:1}
input.search,select.filter{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--input);padding:0 10px;outline:none}
input.search:focus,select.filter:focus{border-color:var(--accent)}
.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.icon{width:36px;padding:0;justify-content:center;font-size:19px}
.btn.ghost{border-color:transparent}
.btn svg{flex:none}
/* Narrow detail pane: copy and delete as icons only, so the bar stays on one line. */
#detailPane>.bar{flex-wrap:nowrap}
@container (max-width:560px){#btnCopy,#btnDelete{width:36px;padding:0;justify-content:center}#btnCopy .lbl,#btnDelete .lbl{display:none}}

/* ---- List ------------------------------------------------------------ */
.table-wrap{flex:1;overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
 color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
@supports (background:color-mix(in srgb,red,blue)){th{background:color-mix(in srgb,var(--surface) 94%,var(--fg))}}
th .arrow{display:inline-block;width:12px;color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num,th.num{text-align:right}
td.bool,th.bool{text-align:center}
td.bool{color:var(--accent);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel)}
.list-footer{padding:7px 10px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ---- Detail ---------------------------------------------------------- */
.detail-title{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-title .sub{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.detail-body{flex:1;overflow:auto;min-height:0;padding:4px 16px 16px}
.key-area{padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 6px;overflow-x:auto;position:sticky;top:-4px;background:var(--surface);z-index:1}
@supports (background:color-mix(in srgb,red,blue)){.tabs{background:color-mix(in srgb,var(--surface) 97%,var(--fg))}}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.field{display:grid;grid-template-columns:minmax(120px,32%) 1fr;align-items:center;gap:4px 14px;padding:7px 0}
.field.sep{border-top:1px solid var(--line);margin-top:8px;padding-top:15px}
.field.top{align-items:start}
.field.top>label{padding-top:7px}
.field>label{color:var(--fg)}
.field>label .req{color:var(--danger);margin-left:2px}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl input[type=text],.ctl input[type=number],.ctl input[type=date],.ctl select,.ctl textarea{
 width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;outline:none;border-radius:0}
.ctl textarea{resize:vertical;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--input);line-height:1.45}
.ctl select{cursor:pointer}
.ctl input:focus,.ctl select:focus{border-bottom-color:var(--accent)}
.ctl textarea:focus{border-color:var(--accent)}
.ctl .suffix{color:var(--muted);padding:0 2px 0 4px;white-space:nowrap}
.ctl .prefix{color:var(--muted);padding:0 4px 0 2px;white-space:nowrap}
.ctl input[type=number]{text-align:right}
.ctl input[type=date]{text-align:left;min-height:2.3em}
.ctl input[type=date]::-webkit-date-and-time-value{text-align:left}
.ctl.short{max-width:15em}
.ctl.affix{gap:0;border-bottom:1px solid var(--line)}
.ctl.affix input{border-bottom:0!important}
.ctl.affix:focus-within{border-bottom-color:var(--accent)}
.field.invalid .ctl.affix{border-bottom-color:var(--danger)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)!important}
.field .err{grid-column:2;color:var(--danger);font-size:13px}
@container (max-width:430px){
 .field{grid-template-columns:1fr;gap:2px}
 .field .err{grid-column:1}
 .field.top>label{padding-top:0}
}
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:11px;background:rgba(128,128,128,.35);transition:.15s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.actions .state{margin-right:auto;color:var(--muted);font-size:13px;align-self:center}
.notice{margin:10px 16px 0;padding:9px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice .grow{flex:1 1 160px}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}

/* ---- Overlay + toast ------------------------------------------------- */
#overlay{position:absolute;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:min(460px,100%);padding:18px 18px 14px}
.dlg-title{font-weight:600;font-size:17px;margin-bottom:6px}
.dlg-text{color:var(--muted);margin-bottom:16px;white-space:pre-line}
.dlg-buttons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toast{position:absolute;left:50%;bottom:58px;transform:translate(-50%,10px);background:#2f3337;color:#fff;padding:8px 14px;border-radius:18px;
 font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{background:var(--danger)}
.busy{opacity:.6;pointer-events:none}
</style></head><body>
<div id="app" data-size="l" data-view="list">
 <div id="cfgError"><div class="cfg-title" data-t="Table not available">Table not available</div><div class="cfg-text" id="cfgErrorText"></div></div>
 <div id="summary">
  <div class="sum-title" id="sumTitle"></div>
  <div class="sum-count" id="sumCount">0</div>
  <div class="sum-label" data-t="Records">Records</div>
  <div class="sum-groups" id="sumGroups"></div>
 </div>

 <section id="listPane">
  <div class="bar">
   <select class="filter" id="filter" aria-label="Filter"></select>
   <input class="search grow" id="search" type="search" placeholder="Search…" aria-label="Search…" data-t-placeholder="Search…">
   <button class="btn primary" id="btnNew" type="button" title="New record" data-t-title="New record" data-t="＋ New">＋ New</button>
  </div>
  <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="empty hidden" id="listEmpty" data-t="No records">No records</div></div>
  <div class="list-footer" id="listFooter"></div>
 </section>

 <section id="detailPane">
  <div class="bar">
   <button class="btn icon ghost" id="btnBack" type="button" title="Back to list" data-t-title="Back to list">‹</button>
   <div class="detail-title grow" id="detailTitle"></div>
   <button class="btn icon" id="btnPrev" type="button" title="Previous record" data-t-title="Previous record">↑</button>
   <button class="btn icon" id="btnNext" type="button" title="Next record" data-t-title="Next record">↓</button>
   <button class="btn" id="btnCopy" type="button" title="Copy" data-t-title="Copy"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span class="lbl" data-t="Copy">Copy</span></button>
   <button class="btn danger" id="btnDelete" type="button" title="Delete" data-t-title="Delete"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span class="lbl" data-t="Delete">Delete</span></button>
  </div>
  <div class="notice hidden" id="notice"></div>
  <div class="detail-body" id="detailBody"></div>
  <div class="placeholder hidden" id="detailEmpty" data-t="Select a record in the list or create one with “New”.">Select a record in the list or create one with “New”.</div>
  <div class="actions" id="actions">
   <span class="state" id="stateText"></span>
   <button class="btn" id="btnDiscard" type="button">Discard</button>
   <button class="btn primary" id="btnSave" type="button" data-t="Save">Save</button>
  </div>
 </section>
<div id="overlay" class="hidden"><div class="dialog" role="dialog" aria-modal="true"><div class="dlg-title" id="dlgTitle"></div><div class="dlg-text" id="dlgText"></div><div class="dlg-buttons" id="dlgButtons"></div></div></div>
<div id="toast"></div>
</div>
<script>
'use strict';
// Every tile instance is an independent client: selection, edit state and
// unsaved input live here in the browser, never in shared Symcon variables.
const CLIENT=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const $=id=>document.getElementById(id);
const S={schema:null,fields:[],byId:{},keyFields:[],tabs:[],records:new Map(),sort:[],filter:'',search:'',
 sel:null,draft:null,tab:null,notice:null,busy:false,schemaSig:''};
const pending=new Map();let reqNo=0;
// Texts: English in the code, translated by the module (Symcon language) and sent with every full message.
let TEXTS={};
function T(s,...a){return (TEXTS[s]||s).replace(/\{(\d+)\}/g,(m,i)=>a[i]!==undefined?String(a[i]):m)}
function applyTexts(){
 for(const e of document.querySelectorAll('[data-t]'))e.textContent=T(e.dataset.t);
 for(const e of document.querySelectorAll('[data-t-title]'))e.title=T(e.dataset.tTitle);
 for(const e of document.querySelectorAll('[data-t-placeholder]')){e.placeholder=T(e.dataset.tPlaceholder);e.setAttribute('aria-label',e.placeholder)}
}

// ---------------------------------------------------------------------------
// Messages from the module
// ---------------------------------------------------------------------------
function handleMessage(data){
 if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){console.error(e);return}}
 if(!data||typeof data!=='object')return;
 if(data.t==='full'){if(data.c&&data.c!==CLIENT)return;applyFull(data)}
 else if(data.t==='changed')applyChanged(data);
 else if(data.t==='error'&&data.c===CLIENT)resolve(data);
}
function resolve(msg){const f=pending.get(msg.r);if(f){pending.delete(msg.r);f(msg)}}

function applyFull(d){
 if(d.texts&&typeof d.texts==='object'){TEXTS=d.texts;applyTexts()}
 // Invalid configuration: show the reason instead of the table.
 if(d.error){app.dataset.error='1';$('cfgErrorText').textContent=d.error;closeDialog();S.schemaSig='';S.draft=null;S.sel=null;S.records=new Map();return}
 delete app.dataset.error;
 const sig=JSON.stringify(d.schema);
 const schemaChanged=sig!==S.schemaSig;
 S.schema=d.schema||{fields:[]};S.schemaSig=sig;
 S.fields=S.schema.fields||[];
 S.byId={};for(const f of S.fields)S.byId[f.id]=f;
 S.keyFields=S.fields.filter(f=>f.key!=null).sort((a,b)=>a.key-b.key);
 S.tabs=[...new Set(S.fields.filter(f=>f.key==null).map(f=>f.tab||T('General')))];
 S.records=new Map((d.records||[]).map(r=>[r.k,{rev:r.rev,v:r.v}]));
 if(schemaChanged){
  S.sort=(S.schema.sort||[]).map(s=>typeof s==='string'?{id:s,dir:1}:{id:s.id,dir:s.dir<0?-1:1}).filter(s=>S.byId[s.id]);
  S.filter='';S.draft=null;S.sel=null;S.notice=null;S.tab=S.tabs[0]||null;setView('list');
 }else if(S.draft&&!S.draft.isNew&&!S.records.has(S.draft.orig)){
  if(S.draft.dirty)S.notice={kind:'deleted'};else closeDetail();
 }
 renderAll();
}

function applyChanged(d){
 if(d.old!=null)S.records.delete(d.old);
 if(d.rec)S.records.set(d.rec.k,{rev:d.rec.rev,v:d.rec.v});
 if(d.c===CLIENT&&pending.has(d.r)){resolve(d);renderList();renderSummary();return}
 // Change by another client: does it touch the record that is open here?
 const dr=S.draft;
 if(dr&&!dr.isNew&&d.old===dr.orig){
  if(d.op==='delete'){
   if(dr.dirty){S.notice={kind:'deleted'}}else{closeDetail();toast(T('Record was deleted by another client'))}
  }else if(dr.dirty){S.notice={kind:'changed',key:d.key}}
  else{openRecord(d.key);toast(T('Updated by another client'))}
 }
 renderList();renderSummary();renderNotice();
}

// ---------------------------------------------------------------------------
// Requests to the module
// ---------------------------------------------------------------------------
function send(op,payload){
 return new Promise(res=>{
  const r=++reqNo;pending.set(r,res);
  try{requestAction('Request',JSON.stringify(Object.assign({c:CLIENT,r,op},payload)))}
  catch(e){pending.delete(r);res({t:'error',code:'transport',msg:T('No connection to the module.')});return}
  setTimeout(()=>{if(pending.has(r)){pending.delete(r);res({t:'error',code:'timeout',msg:T('The module did not respond.')})}},10000);
 });
}

async function save(force){
 const d=S.draft;if(!d||S.busy)return;
 const bad=validate();
 if(bad.length){
  d.invalid=new Set(bad);
  const first=S.byId[bad[0]];if(first.key==null)S.tab=first.tab||T('General');
  renderDetail();toast(T('Please fill in the required fields'),'error');return;
 }
 setBusy(true);
 const res=await send('save',{key:d.isNew?null:d.orig,rev:d.rev,values:d.values,force:!!force});
 setBusy(false);
 if(res.t==='changed'){S.notice=null;openRecord(res.key);toast(T('Saved'));return}
 handleError(res,'save');
}

async function remove(force){
 const d=S.draft;if(!d||d.isNew||S.busy)return;
 setBusy(true);
 const res=await send('delete',{key:d.orig,rev:d.rev,force:!!force});
 setBusy(false);
 if(res.t==='changed'){closeDetail();toast(T('Deleted'));return}
 handleError(res,'delete');
}

function handleError(res,op){
 const d=S.draft;
 switch(res.code){
  case 'conflict':
   dialog(T('Conflict'),res.msg+(op==='save'?'\n'+T('Your changes have not been saved yet.'):''),[
    {label:T('Cancel')},
    {label:T('Reload'),action:()=>{S.notice=null;openRecord(res.rec.k)}},
    {label:op==='save'?T('Overwrite'):T('Delete anyway'),kind:op==='save'?'primary':'danger-fill',action:()=>op==='save'?save(true):remove(true)}
   ]);break;
  case 'notfound':
   if(op==='save'){
    dialog(T('Record deleted'),res.msg+'\n'+T('Create it again with your changes?'),[
     {label:T('Discard'),action:closeDetail},
     {label:T('Create again'),kind:'primary',action:()=>{d.isNew=true;d.orig=null;S.notice=null;save()}}
    ]);
   }else{closeDetail();toast(res.msg)}
   break;
  case 'duplicate':
   d.invalid=new Set(S.keyFields.map(f=>f.id));renderDetail();
   dialog(T('Key already exists'),res.msg+'\n'+T('Please adjust the key fields.'),[{label:'OK',kind:'primary'}]);break;
  default:
   dialog(T('Error'),res.msg||T('Unknown error'),[{label:'OK',kind:'primary'}]);
 }
}

// ---------------------------------------------------------------------------
// Edit state
// ---------------------------------------------------------------------------
// f.store is the storage type (string, integer, float, boolean); f.type the input (text, textarea, date, int, float, bool, select).
function affix(f,s){return (f.prefix?f.prefix+' ':'')+s+(f.suffix?' '+f.suffix:'')}
function isBoolField(f){return f.store==='boolean'||(!f.store&&f.type==='bool')}
function defaultValue(f){if(f.default!==undefined)return f.default;if(isBoolField(f))return false;if(f.type==='int'||f.type==='float'||f.store==='integer'||f.store==='float')return null;return ''}
function isEmpty(f,v){if(isBoolField(f))return false;return v===null||v===undefined||String(v).trim()===''}
// Converts the string value of a select element back to the storage type.
function fromOption(f,str){
 if(f.store==='boolean')return str==='true';
 if(str===''||str==null)return f.store==='integer'?null:'';
 if(f.store==='integer')return parseInt(str,10);
 return str;
}
function validate(){
 const d=S.draft,bad=[];
 for(const f of S.fields){
  const v=d.values[f.id];
  if((f.required||f.key!=null)&&isEmpty(f,v))bad.push(f.id);
  else if((f.type==='int'||f.type==='float')&&v!==null&&((f.min!=null&&v<f.min)||(f.max!=null&&v>f.max)))bad.push(f.id);
 }
 return bad;
}
function errorText(f){
 const v=S.draft.values[f.id];
 if(isEmpty(f,v))return T('Required field');
 if(f.min!=null&&f.max!=null)return T('Value between {0} and {1}',f.min,f.max);
 return T('Invalid value');
}

function openRecord(key){
 const r=S.records.get(key);if(!r){closeDetail();return}
 S.sel=key;
 S.draft={orig:key,rev:r.rev,values:JSON.parse(JSON.stringify(r.v)),dirty:false,isNew:false,invalid:new Set(),copyOf:null};
 if(!S.tabs.includes(S.tab))S.tab=S.tabs[0]||null;
 S.notice=null;setView('detail');renderDetail();renderList();
}
function newRecord(){
 const values={};for(const f of S.fields)values[f.id]=defaultValue(f);
 if(S.filter&&S.schema.filter&&S.byId[S.schema.filter])values[S.schema.filter]=fromOption(S.byId[S.schema.filter],S.filter);
 S.sel=null;S.draft={orig:null,rev:0,values,dirty:false,isNew:true,invalid:new Set(),copyOf:null};
 S.tab=S.tabs[0]||null;S.notice=null;setView('detail');renderDetail();renderList();focusFirstKey();
}
function copyRecord(){
 const d=S.draft;if(!d)return;
 const title=keyTitle(d.values);
 S.sel=null;S.draft={orig:null,rev:0,values:JSON.parse(JSON.stringify(d.values)),dirty:true,isNew:true,invalid:new Set(),copyOf:title};
 S.notice=null;renderDetail();renderList();focusFirstKey();toast(T('Copy created – adjust the key and save'));
}
function closeDetail(){S.draft=null;S.sel=null;S.notice=null;setView('list');renderDetail();renderList()}
function discard(){
 const d=S.draft;if(!d)return;
 if(d.isNew){closeDetail();return}
 openRecord(d.orig);
}
// Runs an action that would drop unsaved input only after confirmation.
function guard(action,text){
 if(S.draft&&S.draft.dirty){
  dialog(T('Unsaved changes'),text||T('The changes to this record will be lost.'),[
   {label:T('Back')},{label:T('Discard'),kind:'danger-fill',action}
  ]);
 }else action();
}
function focusFirstKey(){setTimeout(()=>{const el=document.querySelector('.key-area input,.key-area select');if(el)el.focus()},30)}
function setBusy(b){S.busy=b;$('detailPane').classList.toggle('busy',b)}

// ---------------------------------------------------------------------------
// Formatting and sorting
// ---------------------------------------------------------------------------
const collator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
// Values offered by the list filter: the options, or yes/no for a Boolean without options.
function filterOptions(f){return (f.options&&f.options.length)?f.options:(isBoolField(f)?[{value:true,label:T('Yes')},{value:false,label:T('No')}]:[])}
function optLabel(f,v){const o=(f.options||[]).find(o=>String(o.value)===String(v));return o?o.label:(v==null?'':String(v))}
function fmt(f,v){
 if(v===null||v===undefined)return '';
 switch(f.type){
  case 'bool':return v?'✓':'';
  case 'select':return optLabel(f,v);
  case 'date':{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);return m?new Date(+m[1],m[2]-1,+m[3]).toLocaleDateString(undefined,{day:'2-digit',month:'2-digit',year:'numeric'}):''}
  case 'float':{const d=f.digits??2;return affix(f,Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}))}
  case 'int':return affix(f,Number(v).toLocaleString(undefined,{useGrouping:false}));
  case 'textarea':{const s=String(v).split('\n')[0];return s.length>80?s.slice(0,80)+'…':s}
  default:return String(v);
 }
}
function cmp(f,a,b){
 const ea=isEmpty(f,a),eb=isEmpty(f,b);
 if(ea||eb)return ea===eb?0:(ea?1:-1);
 switch(f.type){
  case 'int':case 'float':return a-b;
  case 'bool':return (a?1:0)-(b?1:0);
  case 'date':return a<b?-1:a>b?1:0;
  case 'select':{const o=f.options||[],ia=o.findIndex(x=>String(x.value)===String(a)),ib=o.findIndex(x=>String(x.value)===String(b));return ia-ib}
  default:return collator.compare(String(a),String(b));
 }
}
// Record title: schema.recordTitle with {name} placeholders (unknown ones stay as text), otherwise the key fields.
function keyTitle(values){
 const t=S.schema.recordTitle||'';
 if(!t)return S.keyFields.map(f=>fmt(f,values[f.id])).filter(s=>s!=='').join(' · ')||'—';
 return t.replace(/\{([^{}]+)\}/g,(m,name)=>{const n=name.trim().toLowerCase(),f=S.schema.fields.find(x=>(x.name||'').toLowerCase()===n);return f?fmt(f,values[f.id]):m}).trim()||'—';
}
function listColumns(){const c=S.fields.filter(f=>f.list);return c.length?c:S.keyFields}

function visibleRows(){
 const q=S.search.trim().toLowerCase(),cols=listColumns(),fid=S.schema&&S.schema.filter;
 let rows=[...S.records.entries()].map(([k,r])=>({k,v:r.v}));
 if(S.filter&&fid)rows=rows.filter(r=>String(r.v[fid])===S.filter);
 if(q)rows=rows.filter(r=>cols.some(f=>fmt(f,r.v[f.id]).toLowerCase().includes(q))||S.fields.some(f=>(f.type==='text'||f.type==='textarea')&&String(r.v[f.id]||'').toLowerCase().includes(q)));
 const sorts=S.sort.length?S.sort:S.keyFields.map(f=>({id:f.id,dir:1}));
 rows.sort((a,b)=>{for(const s of sorts){const c=cmp(S.byId[s.id],a.v[s.id],b.v[s.id]);if(c)return c*s.dir}return collator.compare(a.k,b.k)});
 return rows;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function el(tag,props,...kids){
 const e=document.createElement(tag);
 for(const [k,v] of Object.entries(props||{})){
  if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
  else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);
 }
 for(const c of kids.flat())if(c!=null)e.append(c);
 return e;
}
function renderAll(){detectTheme();renderFilter();renderList();renderDetail();renderSummary();layout()}

function renderFilter(){
 const sel=$('filter'),fid=S.schema&&S.schema.filter,f=fid&&S.byId[fid];
 sel.classList.toggle('hidden',!f);
 if(!f)return;
 sel.replaceChildren(el('option',{value:'',text:T('{0}: all',f.label||'')}),...filterOptions(f).map(o=>el('option',{value:String(o.value),text:o.label})));
 sel.value=S.filter;
}

function renderList(){
 const cols=listColumns(),rows=visibleRows(),prim=S.sort[0];
 $('thead').replaceChildren(el('tr',null,cols.map(f=>{
  const num=f.type==='int'||f.type==='float';
  const arrow=prim&&prim.id===f.id?(prim.dir>0?'▲':'▼'):'';
  return el('th',{class:num?'num':f.type==='bool'?'bool':'',onclick:()=>sortBy(f.id),title:T('Sort by {0}',f.listLabel||f.label)},(f.listLabel||f.label)+' ',el('span',{class:'arrow',text:arrow}));
 })));
 $('tbody').replaceChildren(...rows.map(r=>el('tr',{
   class:r.k===S.sel?'sel':'','data-key':r.k,
   onclick:()=>{if(r.k!==S.sel||!S.draft)guard(()=>openRecord(r.k));else setView('detail')}
  },cols.map(f=>el('td',{class:f.type==='int'||f.type==='float'?'num':f.type==='bool'?'bool':'',text:fmt(f,r.v[f.id]),title:f.type==='textarea'||f.type==='text'?String(r.v[f.id]??''):null})))));
 $('listEmpty').classList.toggle('hidden',rows.length>0);
 const total=S.records.size;
 $('listFooter').textContent=rows.length===total?T('{0} records',total):T('{0} of {1} records',rows.length,total);
 const selRow=document.querySelector('tbody tr.sel');if(selRow)selRow.scrollIntoView({block:'nearest'});
}

function sortBy(id){
 const p=S.sort[0];
 if(p&&p.id===id)p.dir=-p.dir;
 else S.sort=[{id,dir:1},...S.sort.filter(s=>s.id!==id)].slice(0,3);
 renderList();
}

function renderDetail(){
 const d=S.draft,has=!!d;
 $('detailBody').classList.toggle('hidden',!has);
 $('actions').classList.toggle('hidden',!has);
 $('detailEmpty').classList.toggle('hidden',has);
 for(const id of ['btnCopy','btnDelete','btnPrev','btnNext'])$(id).classList.toggle('hidden',!has||d.isNew);
 renderTitle();renderNotice();updateActions();
 if(!has){$('detailBody').replaceChildren();return}

 const body=[];
 body.push(el('div',{class:'key-area'},S.keyFields.map(fieldRow)));
 const fields=S.fields.filter(f=>f.key==null);
 if(S.tabs.length>1){
  body.push(el('div',{class:'tabs',role:'tablist'},S.tabs.map(t=>{
   const err=fields.some(f=>(f.tab||T('General'))===t&&d.invalid.has(f.id));
   return el('button',{type:'button',class:'tab'+(t===S.tab?' active':''),role:'tab',onclick:()=>{S.tab=t;renderDetail()}},t,err?el('span',{class:'dot'}):null);
  })));
 }
 const shown=S.tabs.length>1?fields.filter(f=>(f.tab||T('General'))===S.tab):fields;
 shown.forEach((f,i)=>body.push(fieldRow(f,i)));
 const scroll=$('detailBody').scrollTop;
 $('detailBody').replaceChildren(...body);
 $('detailBody').scrollTop=scroll;
 for(const t of document.querySelectorAll('.ctl textarea'))autosize(t);
 updateNav();
}

function fieldRow(f,index){
 const d=S.draft,v=d.values[f.id],id='f_'+f.id;
 const set=val=>{
  d.values[f.id]=val;d.dirty=true;
  if(d.invalid.delete(f.id)){row.classList.remove('invalid');const e=row.querySelector('.err');if(e)e.remove()}
  if(f.key!=null)renderTitle();
  updateActions();
 };
 let ctl;
 switch(f.type){
  case 'bool':{
   const cb=el('input',{type:'checkbox',id});cb.checked=!!v;cb.addEventListener('change',()=>set(cb.checked));
   ctl=el('label',{class:'switch'},cb,el('span'));break;
  }
  case 'select':{
   const s=el('select',{id});
   const opts=(f.options||[]).map(o=>el('option',{value:String(o.value),text:o.label}));
   const known=(f.options||[]).some(o=>String(o.value)===String(v));
   // Unknown stored value (option removed meanwhile): keep it visible until the user chooses.
   if(!known&&!isEmpty(f,v))opts.unshift(el('option',{value:String(v),text:String(v)+' ?'}));
   // Empty choice for optional fields; never for Boolean.
   if(!isBoolField(f)&&(!(f.required||f.key!=null)||isEmpty(f,v)))opts.unshift(el('option',{value:'',text:'—'}));
   s.replaceChildren(...opts);s.value=v==null?'':String(v);
   s.addEventListener('change',()=>set(fromOption(f,s.value)));ctl=s;break;
  }
  case 'int':case 'float':{
   const step=f.type==='int'?1:Math.pow(10,-(f.digits??2));
   const n=el('input',{type:'number',id,step,min:f.min,max:f.max,inputmode:f.type==='int'?'numeric':'decimal'});
   n.value=v==null?'':String(v);
   n.addEventListener('input',()=>set(n.value===''?null:(f.type==='int'?parseInt(n.value,10):parseFloat(n.value))));ctl=n;break;
  }
  case 'date':{
   const i=el('input',{type:'date',id});i.value=v||'';i.addEventListener('input',()=>set(i.value));ctl=i;break;
  }
  case 'textarea':{
   const t=el('textarea',{id,rows:f.rows||3});t.value=v??'';
   t.addEventListener('input',()=>{autosize(t);set(t.value)});ctl=t;break;
  }
  default:{
   const i=el('input',{type:'text',id,autocomplete:'off'});i.value=v??'';i.addEventListener('input',()=>set(i.value));ctl=i;
  }
 }
 const req=(f.required||f.key!=null)&&!isBoolField(f);
 const invalid=d.invalid.has(f.id);
 const row=el('div',{class:'field'+(f.separator&&index>0?' sep':'')+(f.type==='textarea'?' top':'')+(invalid?' invalid':'')},
  el('label',{for:id},f.label,req?el('span',{class:'req',text:'*'}):null),
  el('div',{class:'ctl'+(['int','float','date'].includes(f.type)?' short':'')+((f.prefix||f.suffix)&&f.type!=='bool'?' affix':'')},f.prefix&&f.type!=='bool'?el('span',{class:'prefix',text:f.prefix}):null,ctl,f.suffix&&f.type!=='bool'?el('span',{class:'suffix',text:f.suffix}):null),
  invalid?el('div',{class:'err',text:errorText(f)}):null);
 return row;
}
function autosize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,480)+'px'}

function renderTitle(){
 const d=S.draft,t=$('detailTitle');
 if(!d){t.replaceChildren();return}
 const title=keyTitle(d.values);
 const main=d.isNew?(d.copyOf?T('Copy of {0}',d.copyOf):T('New record')):title;
 t.replaceChildren(main);
 if(d.isNew&&title!=='—')t.append(el('span',{class:'sub',text:'→ '+title}));
}
function updateActions(){
 const d=S.draft;if(!d)return;
 $('btnSave').disabled=!d.dirty&&!d.isNew;
 $('btnDiscard').disabled=!d.dirty&&!d.isNew;
 $('btnDiscard').textContent=d.isNew?T('Cancel'):T('Discard');
 $('stateText').textContent=d.isNew?T('Not saved yet'):(d.dirty?T('Changed'):'');
}
function updateNav(){
 const d=S.draft;if(!d||d.isNew)return;
 const rows=visibleRows(),i=rows.findIndex(r=>r.k===d.orig);
 $('btnPrev').disabled=i<=0;$('btnNext').disabled=i<0||i>=rows.length-1;
}
function step(dir){
 const d=S.draft;if(!d||d.isNew)return;
 const rows=visibleRows(),i=rows.findIndex(r=>r.k===d.orig),t=rows[i+dir];
 if(t)guard(()=>openRecord(t.k));
}

function renderNotice(){
 const n=S.notice,box=$('notice');
 box.classList.toggle('hidden',!n||!S.draft);
 if(!n||!S.draft)return;
 if(n.kind==='changed'){
  box.replaceChildren(el('span',{class:'grow',text:T('This record has been changed by another client in the meantime.')}),
   el('button',{type:'button',class:'btn',text:T('Reload'),onclick:()=>guard(()=>openRecord(n.key),T('Your changes will be replaced by the current version.'))}));
 }else{
  box.replaceChildren(el('span',{class:'grow',text:T('This record has been deleted by another client. Saving creates it again.')}));
 }
}

function renderSummary(){
 if(!S.schema)return;
 $('sumTitle').textContent=S.schema.title||'';
 $('sumCount').textContent=String(S.records.size);
 const f=S.schema.filter&&S.byId[S.schema.filter];
 if(f){
  const counts={};for(const r of S.records.values()){const k=String(r.v[f.id]);counts[k]=(counts[k]||0)+1}
  $('sumGroups').textContent=filterOptions(f).filter(o=>counts[String(o.value)]).map(o=>`${o.label} ${counts[String(o.value)]}`).join(' · ');
 }else $('sumGroups').textContent='';
}

// ---------------------------------------------------------------------------
// Responsive layout: the tile size decides, not the configuration
// ---------------------------------------------------------------------------
const app=$('app');
// Bottom margin and padding of a page element, so the tile does not start scrolling.
function bottomSpacing(e){if(!e)return 0;const cs=getComputedStyle(e);return (parseFloat(cs.marginBottom)||0)+(parseFloat(cs.paddingBottom)||0)}
// As in TreeView/HiddenMenu: measure the real top of #app (body margin, tile
// title, wrappers) and give it the remaining height. The size class follows.
function layout(){
 const vv=window.visualViewport;
 const bottom=Math.min(document.documentElement.clientHeight||window.innerHeight,vv?vv.offsetTop+vv.height:window.innerHeight);
 const top=Math.max(0,app.getBoundingClientRect().top);
 const h=Math.max(0,Math.floor(bottom-top-bottomSpacing(document.body)-bottomSpacing(document.documentElement)));
 if(app.style.height!==h+'px')app.style.height=h+'px';
 const w=app.clientWidth,size=(w<300||h<210)?'s':(w<720?'m':'l');
 if(app.dataset.size!==size)app.dataset.size=size;
 // Without a tile title Symcon puts its maximize button over the content.
 // A title pushes #app down; near the top edge there is none.
 const corner=top<28?'40px':'0px';
 if(app.style.getPropertyValue('--corner')!==corner)app.style.setProperty('--corner',corner);
 detectTheme();
}
// Light or dark follows the visualization: Symcon provides --content-color.
// Only without it the operating system setting decides.
const darkQuery=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function rgba(c){const m=/rgba?\(([^)]+)\)/.exec(c||'');if(!m)return null;const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(Number);return {r:p[0],g:p[1],b:p[2],a:p.length>3?p[3]:1}}
function luminance(c){return (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255}
function detectTheme(){
 const cs=getComputedStyle(app);
 let dark;
 if(cs.getPropertyValue('--content-color').trim()){const c=rgba(cs.color);dark=!!c&&luminance(c)>0.5}
 else dark=!!(darkQuery&&darkQuery.matches);
 const theme=dark?'dark':'light';
 if(app.dataset.theme!==theme)app.dataset.theme=theme;
 // Sticky headers and dialogs need an opaque surface: take the first opaque
 // background above the tile, otherwise --card-color or the theme default.
 let surface='';
 if(!cs.getPropertyValue('--card-color').trim()){
  for(let e=app.parentElement;e;e=e.parentElement){const b=rgba(getComputedStyle(e).backgroundColor);if(b&&b.a>=0.95){surface=`rgb(${b.r},${b.g},${b.b})`;break}}
 }
 if(app.style.getPropertyValue('--surface')!==surface){if(surface)app.style.setProperty('--surface',surface);else app.style.removeProperty('--surface')}
}
if(darkQuery&&darkQuery.addEventListener)darkQuery.addEventListener('change',detectTheme);
function setView(v){app.dataset.view=v}
window.addEventListener('resize',layout);
if(window.visualViewport)window.visualViewport.addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe(document.body);
layout();

// ---------------------------------------------------------------------------
// Dialog and toast
// ---------------------------------------------------------------------------
function dialog(title,text,buttons){
 $('dlgTitle').textContent=title;$('dlgText').textContent=text;
 $('dlgButtons').replaceChildren(...buttons.map(b=>el('button',{type:'button',class:'btn '+(b.kind||''),text:b.label,onclick:()=>{closeDialog();if(b.action)b.action()}})));
 $('overlay').classList.remove('hidden');
 const last=$('dlgButtons').lastElementChild;if(last)last.focus();
}
function closeDialog(){$('overlay').classList.add('hidden')}
let toastTimer=null;
function toast(text,kind){
 const t=$('toast');t.textContent=text;t.className='show '+(kind||'');
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',2600);
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
$('btnNew').addEventListener('click',()=>guard(newRecord));
$('btnCopy').addEventListener('click',copyRecord);
$('btnDelete').addEventListener('click',()=>{
 const d=S.draft;if(!d)return;
 dialog(T('Delete record?'),T('“{0}” will be deleted permanently.',keyTitle(d.values)),[{label:T('Cancel')},{label:T('Delete'),kind:'danger-fill',action:()=>remove(false)}]);
});
$('btnSave').addEventListener('click',()=>save(false));
$('btnDiscard').addEventListener('click',()=>{
 const d=S.draft;if(!d)return;
 if(!d.dirty){discard();return}
 dialog(d.isNew?T('Discard new record?'):T('Discard changes?'),T('The input will be lost.'),[{label:T('Back')},{label:T('Discard'),kind:'danger-fill',action:discard}]);
});
$('btnBack').addEventListener('click',()=>{if(S.draft&&S.draft.isNew)guard(closeDetail);else setView('list')});
$('btnPrev').addEventListener('click',()=>step(-1));
$('btnNext').addEventListener('click',()=>step(1));
$('filter').addEventListener('change',e=>{S.filter=e.target.value;renderList();updateNav()});
$('search').addEventListener('input',e=>{S.search=e.target.value;renderList();updateNav()});
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDialog()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('overlay').classList.contains('hidden')){closeDialog();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(S.draft)save(false)}
});
</script>
</body></html>
